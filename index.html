<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0d10"><link rel="icon" href="icon-192.png"><title>Sacrilegious Discourse – Producer</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;font:16px system-ui,sans-serif;background:#0d0d10;color:#eee;display:flex;flex-direction:column;height:100dvh}
  header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#17171c;border-bottom:1px solid #2a2a33}
  h1{font-size:15px;margin:0;flex:1;letter-spacing:.5px}
  button{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px}
  button.stop{background:#dc2626} button.ghost{background:#2a2a33}
  #dot{width:10px;height:10px;border-radius:50%;background:#555} #dot.on{background:#22c55e;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.3}}
  #cards{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
  .card{border-radius:14px;padding:14px;background:#1c1c24;border-left:6px solid #888}
  .card.correction{border-color:#f97316;background:#2a1a10} .card.answer{border-color:#38bdf8;background:#10202a}
  .card.context{border-color:#a78bfa;background:#1e1830} .card.angle{border-color:#34d399;background:#10261d}
  .ttl{font-size:22px;font-weight:700;margin:4px 0}
  .card.new{animation:flash 1.5s} @keyframes flash{0%{box-shadow:0 0 0 3px #fff}100%{box-shadow:none}}
  #status{padding:4px 14px;font-size:12px;color:#8a8a99;background:#0a0a0d;display:flex;justify-content:space-between}
  #status.err{color:#f87171}
  .tag{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
  .claim{font-size:13px;opacity:.65;margin:4px 0}
  .txt{font-size:20px;line-height:1.35}
  .low{opacity:.7}
  #live{padding:8px 14px;font-size:13px;color:#999;background:#101014;border-top:1px solid #2a2a33;min-height:2.6em;max-height:5em;overflow:hidden}
  #empty{opacity:.4;text-align:center;margin-top:30px}
</style></head><body>
<header>
  <div id="dot"></div><h1>SACRILEGIOUS DISCOURSE · PRODUCER</h1>
  <button class="ghost" id="keybtn">Key</button>
  <button class="ghost" id="clear">Clear</button>
  <button id="go">Start</button>
</header>
<div id="setup" style="display:none;padding:20px"><h2>Paste your OpenAI API key</h2>
<input id="key" type="password" placeholder="sk-..." style="width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:10px;border:1px solid #444;background:#1c1c24;color:#eee">
<p id="kerr" style="color:#f87171"></p><button id="save">Save key</button>
<p style="opacity:.6;font-size:13px">Stored only on this phone and sent only to OpenAI.</p></div>
<div id="cards"><div id="empty">Tap Start. Context, corrections, answers and angles will appear here.</div></div>
<div id="status"><span id="st">idle</span><span id="cnt"></span></div>
<div id="live">…</div>
<script>
const SYSTEM = "You are the behind-the-scenes producer / researcher for the live podcast \"Sacrilegious Discourse\" (religion, belief, culture, irreverent and smart). The hosts are recording RIGHT NOW. You see live speech-to-text (no speaker labels, may have mishearings) and recent context. Feed the hosts useful on-screen notes they can glance at mid-conversation.\nEach time you get new speech, produce 1-3 notes (0 only if it was pure filler/small talk). Types:\n- \"correction\": a host said something factually wrong. Give the right fact, concise.\n- \"answer\": a host asked a question (even rhetorical-but-factual, or \"I wonder...\"). Answer it.\n- \"context\": background that enriches what they're discussing: historical backstory, origin of a term/practice, relevant scripture or text and what it actually says, key figures, dates, how different traditions see it, a surprising related fact. This is your main job; be proactive, specific and concrete (names, dates, numbers, verse references). Prefer one great detail over generic overview.\n- \"angle\": a sharp follow-up question or counterpoint the hosts could raise next, or a fun tension/irony worth poking at.\nRules:\n- Every note: a short bold-able \"title\" (max 6 words) and \"text\" (max 2 sentences, scannable at a glance).\n- Never police belief itself; opinions are fair game for \"context\"/\"angle\", only checkable facts get \"correction\".\n- If STT likely garbled a word, infer the intended topic; don't correct the garble.\n- Do not repeat anything in ALREADY_FLAGGED; build on it or pick something new.\n- If unsure of a fact, set confidence \"low\" and say what to verify. Don't invent quotes or verse numbers.\nReply with ONLY JSON: {\"items\":[{\"type\":\"correction\"|\"answer\"|\"context\"|\"angle\",\"title\":\"...\",\"claim\":\"what they said (short, may be empty for context/angle)\",\"text\":\"...\",\"confidence\":\"high\"|\"medium\"|\"low\"}]}";
const $ = (id) => document.getElementById(id);
const CHUNK_MS = 6000, SILENCE_RMS = 0.008;
const LABEL = { correction: "⚠ CORRECTION", answer: "💡 ANSWER", context: "📚 CONTEXT", angle: "🎤 ANGLE" };
let running = false, stream, ctx, analyser, rec, peak = 0, meterT, chunkT, wake, nCards = 0, nSent = 0, heard = "";
let queue = Promise.resolve(), transcript = [], flagged = [];
const getKey = () => localStorage.getItem("oaikey") || "";
const MODEL = () => localStorage.getItem("model") || "gpt-4.1";

function addCard(it) {
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = "card new " + it.type + (it.confidence === "low" ? " low" : "");
  d.innerHTML = '<div class="tag"></div><div class="ttl"></div><div class="claim"></div><div class="txt"></div>';
  d.querySelector(".tag").textContent = (LABEL[it.type] || String(it.type).toUpperCase()) + (it.confidence === "low" ? " · verify" : "");
  d.querySelector(".ttl").textContent = it.title || "";
  d.querySelector(".claim").textContent = it.claim ? "You said: “" + it.claim + "”" : "";
  d.querySelector(".txt").textContent = it.text;
  $("cards").prepend(d); nCards++;
  if (navigator.vibrate) navigator.vibrate(it.type === "correction" ? [120, 60, 120] : 80);
}
function setStatus(t, err) { $("st").textContent = t; $("status").className = err ? "err" : ""; $("cnt").textContent = nSent + " chunks · " + nCards + " notes"; }

async function openai(path, init) {
  const r = await fetch("https://api.openai.com/v1/" + path, { ...init, headers: { ...(init.headers || {}), authorization: "Bearer " + getKey() } });
  if (!r.ok) throw new Error("OpenAI " + r.status + ": " + (await r.text()).slice(0, 160));
  return r.json();
}
async function transcribe(blob) {
  const f = new FormData();
  const ext = blob.type.includes("mp4") ? "mp4" : blob.type.includes("ogg") ? "ogg" : "webm";
  f.append("file", blob, "chunk." + ext);
  f.append("model", "gpt-4o-mini-transcribe"); f.append("language", "en");
  f.append("prompt", "Podcast conversation about religion, theology, scripture, history and culture. " + transcript.slice(-3).join(" ").slice(-300));
  return ((await openai("audio/transcriptions", { method: "POST", body: f })).text || "").trim();
}
async function analyze(text) {
  transcript.push(text); transcript = transcript.slice(-40);
  const context = transcript.slice(0, -1).slice(-12).join(" ");
  const user = "RECENT CONTEXT:\n" + (context || "(none)") + "\n\nNEW SPEECH:\n" + text + "\n\nALREADY_FLAGGED:\n" + (flagged.slice(-15).join(" | ") || "(none)");
  const j = await openai("chat/completions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
    model: MODEL(), temperature: 0.5, max_tokens: 900, response_format: { type: "json_object" },
    messages: [{ role: "system", content: SYSTEM }, { role: "user", content: user }] }) });
  let items = []; try { items = JSON.parse(j.choices[0].message.content).items || []; } catch {}
  items.forEach((it) => flagged.push((it.title || "") + ": " + (it.text || "").slice(0, 80)));
  return items;
}

function send(blob) {
  nSent++;
  queue = queue.then(async () => {
    setStatus("🧠 transcribing + thinking…");
    try {
      const text = await transcribe(blob);
      if (text) { heard = (heard + " " + text).slice(-400); $("live").textContent = heard; }
      if (text.length >= 8) (await analyze(text)).forEach(addCard);
      setStatus("🎙 listening · last heard " + new Date().toLocaleTimeString());
    } catch (e) { setStatus(e.message, true); }
  });
}

function startChunk() {
  if (!running) return;
  const chunks = []; peak = 0; let loud = false;
  const r = new MediaRecorder(stream);
  r.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  r.onstop = () => { if (loud && chunks.length) send(new Blob(chunks, { type: r.mimeType || "audio/webm" })); };
  r.start();
  chunkT = setTimeout(() => { loud = peak > SILENCE_RMS; if (r.state !== "inactive") r.stop(); startChunk(); }, CHUNK_MS);
  rec = r;
}
async function start() {
  if (!getKey()) return showSetup();
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } }); }
  catch (e) { setStatus("Mic blocked: " + e.message, true); return; }
  ctx = new AudioContext(); analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser);
  const data = new Float32Array(analyser.fftSize);
  meterT = setInterval(() => { analyser.getFloatTimeDomainData(data); let s = 0; for (const v of data) s += v * v;
    const rms = Math.sqrt(s / data.length); peak = Math.max(peak, rms); $("dot").style.boxShadow = "0 0 " + Math.min(20, rms * 400) + "px #22c55e"; }, 100);
  running = true; startChunk(); setStatus("🎙 listening…");
  $("go").textContent = "Stop"; $("go").className = "stop"; $("dot").className = "on";
  try { navigator.wakeLock?.request("screen").then((w) => (wake = w)); } catch {}
}
function stop() {
  running = false; clearTimeout(chunkT); clearInterval(meterT);
  if (rec && rec.state !== "inactive") rec.stop();
  stream?.getTracks().forEach((t) => t.stop()); ctx?.close(); wake?.release();
  $("go").textContent = "Start"; $("go").className = ""; $("dot").className = ""; setStatus("stopped");
}
function showSetup() { $("setup").style.display = "block"; $("cards").style.display = "none"; $("key").value = ""; }
$("go").onclick = () => (running ? stop() : start());
$("clear").onclick = () => { $("cards").innerHTML = ""; heard = ""; transcript = []; flagged = []; $("live").textContent = "…"; };
$("keybtn").onclick = showSetup;
$("save").onclick = () => { const k = $("key").value.trim(); if (!/^sk-/.test(k)) { $("kerr").textContent = "Key should start with sk-"; return; }
  localStorage.setItem("oaikey", k); $("kerr").textContent = ""; $("setup").style.display = "none"; $("cards").style.display = "flex"; };
if (!getKey()) showSetup();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

</script></body></html>
